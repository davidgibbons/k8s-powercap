---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-powercap-k8s-io-v1-powercapschedule
  failurePolicy: Fail
  name: mpowercapschedule.kb.io
  rules:
  - apiGroups:
    - powercap.k8s.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - powercapschedules
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-powercap-k8s-io-v1-powercapschedule
  failurePolicy: Fail
  name: vpowercapschedule.kb.io
  rules:
  - apiGroups:
    - powercap.k8s.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - powercapschedules
  sideEffects: None
