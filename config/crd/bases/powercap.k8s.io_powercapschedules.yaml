---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: unapproved, experimental-only
    controller-gen.kubebuilder.io/version: v0.19.0
  name: powercapschedules.powercap.k8s.io
spec:
  group: powercap.k8s.io
  names:
    kind: PowercapSchedule
    listKind: PowercapScheduleList
    plural: powercapschedules
    singular: powercapschedule
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: PowercapSchedule is the Schema for the powercapschedules API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PowercapSchedule
            properties:
              nodeSelector:
                additionalProperties:
                  type: string
                default: {}
                description: |-
                  NodeSelector is a selector which must be true for the DaemonSet to match a node.
                  Pods are only scheduled on nodes matching these labels.
                type: object
              schedules:
                description: |-
                  Schedules is a list of power management rules.
                  Each schedule can define when to apply power limits and to which zones/constraints.
                items:
                  description: PowercapRule defines a single power management schedule.
                  properties:
                    name:
                      description: Name is a unique identifier for this schedule (e.g.,
                        "workday", "night", "backup").
                      type: string
                    powerLimits:
                      description: |-
                        PowerLimits defines the power limits to apply for this schedule.
                        Each entry can target a specific zone/constraint combination.
                      items:
                        description: PowerLimitEntry defines a power limit for a specific
                          zone and constraint.
                        properties:
                          constraint:
                            description: |-
                              Constraint specifies which constraint within the powercap zone to target.
                              Example: "constraint_0", "constraint_1"
                            pattern: ^constraint_[0-9]+$
                            type: string
                          powerLimit:
                            description: |-
                              PowerLimit is the power limit to apply, in microwatts (µW).
                              Example: 65000000 = 65 Watts
                            format: int64
                            maximum: 1000000000
                            minimum: 1
                            type: integer
                          zone:
                            description: |-
                              Zone specifies the powercap zone to control.
                              Example: "intel-rapl:0", "intel-rapl:1"
                            pattern: ^[a-zA-Z0-9:_-]+$
                            type: string
                        required:
                        - constraint
                        - powerLimit
                        - zone
                        type: object
                      minItems: 1
                      type: array
                    schedule:
                      description: |-
                        Schedule is a cron expression defining when to apply the power limits.
                        Must represent a single point in time (no ranges, lists, or step values).
                        Format: "Minutes Hours Day-of-Month Month Day-of-Week"
                        Example: "0 9 * * 1" (9 AM on Monday)
                      pattern: ^((\d+|\*) ){4}(\d+|\*)$
                      type: string
                  required:
                  - name
                  - powerLimits
                  - schedule
                  type: object
                type: array
              suspend:
                default: false
                description: Suspend suspends the scheduling of power limit changes.
                  When true, no new power limits are applied.
                type: boolean
              timeZone:
                default: UTC
                description: |-
                  TimeZone is the timezone for the schedule. If not specified, defaults to UTC.
                  Example: "America/Los_Angeles", "UTC", "Europe/Paris"
                type: string
            required:
            - schedules
            type: object
          status:
            description: status defines the observed state of PowercapSchedule
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the PowercapSchedule resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScheduleTime:
                description: LastScheduleTime is the last time any schedule was triggered.
                format: date-time
                type: string
              nextScheduleTime:
                description: NextScheduleTime is the next time the earliest schedule
                  is due to trigger.
                format: date-time
                type: string
              scheduleStatuses:
                description: ScheduleStatuses tracks the status of each individual
                  schedule.
                items:
                  description: ScheduleStatus tracks the state of a single schedule.
                  properties:
                    currentPowerLimit:
                      description: CurrentPowerLimit is the current power limit applied
                        by this schedule, in microwatts.
                      format: int64
                      type: integer
                    lastScheduleTime:
                      description: LastScheduleTime is the last time this schedule
                        was triggered.
                      format: date-time
                      type: string
                    name:
                      description: Name is the name of the schedule from the spec.
                      type: string
                    nextScheduleTime:
                      description: NextScheduleTime is the next time this schedule
                        is due to trigger.
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
