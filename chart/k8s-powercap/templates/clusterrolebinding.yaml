apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-powercap.fullname" . }}-manager
  labels:
    {{- include "k8s-powercap.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-powercap.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-powercap.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
