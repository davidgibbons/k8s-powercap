{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "k8s-powercap.fullname" . }}-mutating-webhook-configuration
  labels:
    {{- include "k8s-powercap.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "k8s-powercap.fullname" . }}-webhook-cert
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "k8s-powercap.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-powercap-k8s-io-v1-powercapschedule
    failurePolicy: Fail
    name: mpowercapschedule.kb.io
    rules:
      - apiGroups:
          - powercap.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - powercapschedules
    sideEffects: None
{{- end }}
