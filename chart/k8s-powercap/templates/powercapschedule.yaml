{{- if .Values.powercapSchedule.enabled }}
apiVersion: powercap.k8s.io/v1
kind: PowercapSchedule
metadata:
  name: {{ default (printf "%s-schedule" (include "k8s-powercap.fullname" .)) .Values.powercapSchedule.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-powercap.labels" . | nindent 4 }}
spec:
  timeZone: {{ .Values.powercapSchedule.timeZone | quote }}
  nodeSelector:
    {{- toYaml .Values.powercapSchedule.nodeSelector | nindent 4 }}
  schedules:
    {{- toYaml .Values.powercapSchedule.schedules | nindent 4 }}
  suspend: {{ .Values.powercapSchedule.suspend }}
{{- end }}
