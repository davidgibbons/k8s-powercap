# Default values for k8s-powercap
replicaCount: 1

image:
  repository: ghcr.io/davidgibbons/k8s-powercap
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  runAsUser: 65532
  runAsGroup: 65532

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

webhook:
  enable: true
  port: 9443
  certDir: "/tmp/k8s-webhook-server/serving-certs"
  certName: "tls.crt"
  certKeyName: "tls.key"
  certManager:
    enabled: true
    issuerRef: {}

metrics:
  enable: true
  bindAddress: ":8080"
  secureMetrics: true
  port: 8080
  servicePort: 8080
  serviceName: ""
  certPath: ""
  certName: "tls.crt"
  certKeyName: "tls.key"
  readerRoleName: "k8s-powercap-metrics-reader"

healthProbe:
  bindAddress: ":8081"

leaderElect: true
leaderElectionID: "478dfd91.k8s.io"

# Agent image configuration
agent:
  image:
    repository: ghcr.io/davidgibbons/k8s-powercap-agent
    tag: ""
  pullPolicy: IfNotPresent

# Enable HTTP/2 for metrics and webhook servers
enableHTTP2: false

powercapSchedule:
  enabled: true
  name: ""
  timeZone: "America/Los_Angeles"
  suspend: false
  nodeSelector:
    powercap: "true"
  schedules:
    - name: workday-shoulder
      schedule: "0 7 * * 1-5"
      powerLimits:
        - zone: "intel-rapl:0"
          constraint: "constraint_0"
          powerLimit: 45000000
        - zone: "intel-rapl:0"
          constraint: "constraint_1"
          powerLimit: 70000000
    - name: workday-peak
      schedule: "0 17 * * 1-5"
      powerLimits:
        - zone: "intel-rapl:0"
          constraint: "constraint_0"
          powerLimit: 35000000
        - zone: "intel-rapl:0"
          constraint: "constraint_1"
          powerLimit: 60000000
    - name: offpeak
      schedule: "0 21 * * 1-5"
      powerLimits:
        - zone: "intel-rapl:0"
          constraint: "constraint_0"
          powerLimit: 55000000
        - zone: "intel-rapl:0"
          constraint: "constraint_1"
          powerLimit: 80000000
