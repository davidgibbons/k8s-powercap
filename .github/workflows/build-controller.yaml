name: Build and Push Controller Image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.0.1)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: davidgibbons/k8s-powercap

jobs:
  build-controller:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Resolve release tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set image tag
        run: |
          TAG=${{ env.RELEASE_TAG }}
          echo "IMAGE_TAG=${TAG#v}" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate image digest
        id: digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Create image tag
        run: |
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" > controller-image.txt
          echo "${{ steps.build.outputs.digest }}" > controller-digest.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            controller-image.txt \
            controller-digest.txt \
            --clobber

      - name: Update release notes with Docker links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import os
          import textwrap
          import json
          import subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          image = f"ghcr.io/{repo}/k8s-powercap"
          agent = f"ghcr.io/{repo}/k8s-powercap-agent"
          section = textwrap.dedent(f"""
          ## Docker Images
          - {image}
          - {agent}
          """).strip()
          release = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repo}/releases/tags/{tag}"
          ]))
          body = release.get("body") or ""
          if "## Docker Images" in body:
              raise SystemExit(0)
          new_body = body.rstrip() + ("\n\n" if body.strip() else "") + section + "\n"
          subprocess.check_call([
              "gh", "api", f"repos/{repo}/releases/{release['id']}",
              "-X", "PATCH", "-f", f"body={new_body}"
          ])
          PY

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ env.IMAGE_TAG }}
